name: Daily Scrape

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scrape on Render
        run: |
          base_url="${{ secrets.DASHBOARD_URL }}"
          response=$(curl --fail-with-body --silent --show-error --location \
            --retry 3 --retry-delay 5 \
            --connect-timeout 10 --max-time 300 \
            -X POST "${base_url%/}/api/scrape?pages=1")
          printf '%s\n' "$response"
          parsed=$(printf '%s' "$response" | jq -r '.parsed // 0')
          if [ "$parsed" -eq 0 ]; then
            echo "Scrape completed without parsing any jobs."
            exit 1
          fi
